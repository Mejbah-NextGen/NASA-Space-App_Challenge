{% extends 'public/base_public.html' %}
{% block title %}Choose New Password{% endblock %}
{% block content %}<section class="section"><div class="container-narrow"><div class="form-card" style="margin:auto"><h1>Choose a new password</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-brand" type="submit">Set new password</button></form>{% else %}<div class="app-alert app-alert-error">This reset link is invalid or has expired.</div><a class="btn btn-brand" href="{% url 'accounts:password_reset' %}">Request another link</a>{% endif %}</div></div></section>{% endblock %}
